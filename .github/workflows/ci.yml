name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Cancel superseded runs of the same branch or pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Root workspace: shared crates, edge services, cloud backend (host-buildable).
  # Every Rust step is skipped while the workspace does not exist yet, so the job stays green.
  rust-root:
    name: rust-root
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Detect workspace
        id: probe
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No Cargo.toml at the repository root: skipping."; fi
      - uses: dtolnay/rust-toolchain@1.94.0  # keep in sync with rust-toolchain.toml
        if: steps.probe.outputs.present == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.probe.outputs.present == 'true'
      - name: Format
        if: steps.probe.outputs.present == 'true'
        run: cargo fmt --all -- --check
      - name: Lint
        if: steps.probe.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        if: steps.probe.outputs.present == 'true'
        run: cargo test --workspace
      - name: Docs
        if: steps.probe.outputs.present == 'true'
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Fails when generated.rs was edited by hand or a contract changed without codegen,
      # and when an example in shared/protocols/examples no longer matches its message.
      - name: Contracts up to date
        if: steps.probe.outputs.present == 'true'
        run: tools/scripts/gen-contracts.sh --check

  # Firmware workspace: no_std crates, tested on the host and built for the ESP32-C3 core.
  rust-firmware:
    name: rust-firmware
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Detect workspace
        id: probe
        run: |
          if [ -f iot-node/firmware/Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No firmware workspace: skipping."; fi
      - uses: dtolnay/rust-toolchain@1.94.0  # keep in sync with rust-toolchain.toml
        if: steps.probe.outputs.present == 'true'
        with:
          components: rustfmt, clippy
          targets: riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        if: steps.probe.outputs.present == 'true'
        with:
          workspaces: iot-node/firmware
      - name: Format
        if: steps.probe.outputs.present == 'true'
        working-directory: iot-node/firmware
        run: cargo fmt --all -- --check
      - name: Lint
        if: steps.probe.outputs.present == 'true'
        working-directory: iot-node/firmware
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        if: steps.probe.outputs.present == 'true'
        working-directory: iot-node/firmware
        run: cargo test --workspace
      - name: Build for RISC-V (no_std)
        if: steps.probe.outputs.present == 'true'
        working-directory: iot-node/firmware
        run: cargo build --workspace --target riscv32imc-unknown-none-elf --release
      - name: Docs
        if: steps.probe.outputs.present == 'true'
        working-directory: iot-node/firmware
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Contracts: proto lint and breaking-change check, OpenAPI lint, JSON Schema examples.
  # The Rust bindings drift check runs in rust-root ("Contracts up to date").
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # buf breaking compares with the base branch
      - uses: bufbuild/buf-action@v1.5.0
        with:
          version: 1.73.0
          setup_only: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint contracts (pull request, with breaking check)
        if: github.event_name == 'pull_request'
        run: tools/scripts/lint-contracts.sh --against "origin/${{ github.base_ref }}"
      - name: Lint contracts (push)
        if: github.event_name != 'pull_request'
        run: tools/scripts/lint-contracts.sh
