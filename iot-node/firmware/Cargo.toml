[workspace]
resolver = "3"
# Explicit members: crates are added here as they get a Cargo.toml.
members = ["crates/iomt-frames", "crates/offline-buffer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["thongnguyenk21 <thongnguyenk21@gmail.com>"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
