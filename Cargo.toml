[workspace]
resolver = "3"
members = ["shared/rust"]
# The firmware targets RISC-V and has its own nested workspace.
exclude = ["iot-node/firmware"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["thongnguyenk21 <thongnguyenk21@gmail.com>"]

# One place to pin versions; member crates use `dep.workspace = true`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
