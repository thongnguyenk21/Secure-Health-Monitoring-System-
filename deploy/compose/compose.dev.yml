# Development stack: TimescaleDB for the cloud backend.
# No MQTT (D14) and no cache (ADR-0008); the backend runs with `cargo run`.
services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: iomt
      POSTGRES_USER: iomt
      POSTGRES_PASSWORD: iomt
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "iomt", "-d", "iomt"]
      interval: 5s
      retries: 12

volumes:
  pgdata:
